<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BICTE Computer GK - 630 Practice Questions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            color: #1a202c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 1000px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            padding: 30px;
            margin: 10px 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            color: #2b6cb0;
            font-weight: 700;
        }
        .header .badge {
            background: #2b6cb0;
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }
        .progress-text {
            font-size: 15px;
            color: #4a5568;
            font-weight: 500;
        }
        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 25px;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            max-height: 180px;
            overflow-y: auto;
        }
        .palette-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid #e2e8f0;
            background: #fff;
            font-size: 11px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .palette-btn:hover {
            border-color: #2b6cb0;
            transform: scale(1.05);
        }
        .palette-btn.answered {
            background: #48bb78;
            border-color: #48bb78;
            color: #fff;
        }
        .palette-btn.review {
            background: #ed8936;
            border-color: #ed8936;
            color: #fff;
        }
        .palette-btn.active {
            border-color: #2b6cb0;
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.3);
        }
        .palette-legend {
            display: flex;
            gap: 18px;
            margin-left: auto;
            font-size: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .palette-legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
        }
        .legend-dot.unanswered {
            background: #fff;
            border: 2px solid #e2e8f0;
        }
        .legend-dot.answered {
            background: #48bb78;
            border: 2px solid #48bb78;
        }
        .legend-dot.review {
            background: #ed8936;
            border: 2px solid #ed8936;
        }
        .question-card {
            background: #f7fafc;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 20px;
            min-height: 180px;
        }
        .q-number {
            font-size: 14px;
            font-weight: 600;
            color: #2b6cb0;
            margin-bottom: 12px;
        }
        .q-text {
            font-size: 17px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }
        .option:hover {
            border-color: #2b6cb0;
            background: #ebf4ff;
        }
        .option.selected {
            border-color: #2b6cb0;
            background: #bee3f8;
        }
        .option.correct {
            border-color: #48bb78;
            background: #c6f6d5;
        }
        .option.wrong {
            border-color: #fc8181;
            background: #fed7d7;
        }
        .option input[type="radio"] {
            accent-color: #2b6cb0;
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .option .label {
            font-weight: 600;
            color: #4a5568;
            margin-right: 2px;
        }
        .feedback {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #c6f6d5;
            color: #22543d;
            border-left: 5px solid #48bb78;
        }
        .feedback.wrong {
            background: #fed7d7;
            color: #9b2c2c;
            border-left: 5px solid #fc8181;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }
        .nav .left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-outline {
            background: transparent;
            color: #2b6cb0;
            border: 2px solid #2b6cb0;
        }
        .btn-outline:hover {
            background: #ebf4ff;
        }
        .btn-outline:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-review {
            background: #ed8936;
            color: #fff;
        }
        .btn-review:hover {
            background: #dd6b20;
        }
        .btn-review.active {
            background: #9b2c2c;
        }
        .btn-success {
            background: #38a169;
            color: #fff;
        }
        .btn-success:hover {
            background: #2f855a;
        }
        .btn-danger {
            background: #e53e3e;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c53030;
        }
        .results {
            display: none;
            margin-top: 10px;
        }
        .results.show {
            display: block;
        }
        .result-summary {
            background: #ebf8ff;
            border-radius: 16px;
            padding: 24px 30px;
            text-align: center;
            margin-bottom: 25px;
        }
        .result-summary h2 {
            font-size: 28px;
            color: #2b6cb0;
        }
        .result-summary .score {
            font-size: 48px;
            font-weight: 800;
            color: #2b6cb0;
        }
        .result-summary .sub {
            font-size: 18px;
            color: #4a5568;
        }
        .result-detail {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #edf2f7;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item .qid {
            font-weight: 600;
            color: #4a5568;
            min-width: 35px;
        }
        .result-item .status {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
        }
        .status.correct {
            background: #c6f6d5;
            color: #22543d;
        }
        .status.wrong {
            background: #fed7d7;
            color: #9b2c2c;
        }
        .status.unanswered {
            background: #e2e8f0;
            color: #4a5568;
        }
        .view-toggle {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 15px 0;
        }
        .jump-input {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .jump-input input {
            width: 50px;
            padding: 4px 6px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
        .jump-input input:focus {
            border-color: #2b6cb0;
            outline: none;
        }
        @media (max-width: 700px) {
            .app {
                padding: 14px;
            }
            .header h1 {
                font-size: 16px;
            }
            .q-text {
                font-size: 15px;
            }
            .option {
                font-size: 13px;
                padding: 8px 12px;
            }
            .palette-legend {
                margin-left: 0;
                width: 100%;
                justify-content: flex-start;
                margin-top: 6px;
            }
            .nav {
                flex-direction: column;
                align-items: stretch;
            }
            .nav .left {
                justify-content: center;
            }
            .btn {
                padding: 6px 14px;
                font-size: 12px;
            }
            .result-summary .score {
                font-size: 34px;
            }
            .result-item {
                font-size: 11px;
            }
            .palette-btn {
                width: 28px;
                height: 28px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <div class="header">
            <h1>💻 BICTE Computer GK</h1>
            <div>
                <span class="badge" id="modeBadge">Learning Mode</span>
                <span class="progress-text" id="progressText">1 / 630</span>
            </div>
        </div>

        <div class="palette" id="palette"></div>

        <div class="question-card" id="questionCard">
            <div class="q-number" id="qNumber">Q1.</div>
            <div class="q-text" id="qText">Loading question...</div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback"></div>
        </div>

        <div class="nav">
            <div class="left">
                <button class="btn btn-outline" id="prevBtn">◀ Prev</button>
                <button class="btn btn-outline" id="nextBtn">Next ▶</button>
                <button class="btn btn-review" id="reviewBtn">⭐ Review</button>
                <div class="jump-input">
                    <span style="font-size:13px;color:#4a5568;">Go to:</span>
                    <input type="number" id="jumpInput" min="1" max="630" value="1" />
                    <button class="btn btn-outline" id="jumpBtn" style="padding:4px 12px;">Go</button>
                </div>
            </div>
            <div>
                <button class="btn btn-success" id="submitBtn">✅ Submit</button>
                <button class="btn btn-danger" id="resetBtn" style="display:none;">🔄 Reset</button>
            </div>
        </div>

        <div class="results" id="results">
            <div class="result-summary" id="resultSummary"></div>
            <div class="view-toggle">
                <button class="btn btn-outline" id="toggleDetailsBtn">📋 Show Details</button>
            </div>
            <div class="result-detail" id="resultDetail" style="display:none;"></div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DATA : 630 Computer GK Questions
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const questions = [];

        // Helper to add questions
        function addQ(id, q, opts, ans) {
            questions.push({ id, q, opts, ans });
        }

        // ── Questions 1-630 from PDF ──
        addQ(1, "What is the binary equivalent of the decimal number 11?", { a: "1010", b: "1011", c: "1100", d: "1101" },
            "b");
        addQ(2, "Which key is used to refresh a webpage?", { a: "F5", b: "F10", c: "F1", d: "F12" }, "a");
        addQ(3, "Which key is used to move the cursor to the end of a line?", { a: "End", b: "Home", c: "F5", d: "F12" },
            "a");
        addQ(4, "What is the decimal equivalent of the binary number 1010?", { a: "10", b: "9", c: "11", d: "12" }, "a");
        addQ(5, "What is the decimal equivalent of the binary number 1110?", { a: "13", b: "12", c: "15", d: "14" }, "d");
        addQ(6, "Which of the following is an example of a web browser?", { a: "Adobe Reader", b: "Samsung Internet",
                c: "WordPress", d: "Skype" }, "b");
        addQ(7, "What is the binary equivalent of the decimal number 7?", { a: "111", b: "110", c: "101", d: "100" },
            "a");
        addQ(8, "What is the decimal equivalent of the binary number 1000?", { a: "9", b: "8", c: "7", d: "10" }, "b");
        addQ(9, "Which protocol is used to translate domain names into IP addresses?", { a: "HTTP", b: "FTP", c: "DNS",
                d: "SMTP" }, "c");
        addQ(10, "Which shortcut key is used to print a document?", { a: "Ctrl + P", b: "Ctrl + S", c: "Ctrl + N",
                d: "Ctrl + O" }, "a");
        addQ(11, "Which of the following is a popular question-and-answer platform?", { a: "Quora", b: "LinkedIn",
                c: "Instagram", d: "Pinterest" }, "a");
        addQ(12, "Which of the following is a popular platform for streaming live sports?", { a: "ESPN app", b: "Reddit",
                c: "Instagram", d: "Pinterest" }, "a");
        addQ(13, "What is the binary equivalent of the decimal number 12?", { a: "1111", b: "1010", c: "1100",
                d: "1001" }, "c");
        addQ(14, "Which key opens the Downloads page in most web browsers?", { a: "F12", b: "F10", c: "F5",
                d: "Ctrl+J" }, "d");
        addQ(15, "Which protocol is used for transferring web pages and is the foundation of data communication on the World Wide Web?",
            { a: "POP3", b: "FTP", c: "HTTP", d: "SMTP" }, "c");
        addQ(16, "Which of the following is an example of a programming language?", { a: "Google Chrome", b: "Notepad",
                c: "Java", d: "Windows 11" }, "c");
        addQ(17, "Which of the following is an example of secondary storage?", { a: "RAM", b: "Cache", c: "Hard Disk",
                d: "CPU" }, "c");
        addQ(18, "Which of the following is an open-source LMS widely used by universities and schools?", { a: "Skype",
                b: "WinZip", c: "Photoshop", d: "Moodle" }, "d");
        addQ(19, "What is the hexadecimal equivalent of the decimal number 31?", { a: "1F", b: "30", c: "20", d: "1E" },
            "a");
        addQ(20, "Which of the following is a cloud computing platform used by developers and businesses?", { a: "VLC",
                b: "Notepad", c: "Amazon Web Services (AWS)", d: "Photoshop" }, "c");
        addQ(21, "Which of the following is a valid IPv4 address that can be used for Automatic Private IP Addressing (APIPA)?",
            { a: "999.254.1.1", b: "169.254.1", c: "169.254.1.1.1", d: "169.254.1.1" }, "d");
        addQ(22, "What is the purpose of phishing awareness training?", { a: "Help users recognize and avoid fraudulent attempts to steal information",
                b: "Reduce spam automatically", c: "Speed up email delivery", d: "Increase email storage" }, "a");
        addQ(23, "Which shortcut key is used to create a new folder in Windows?", { a: "Ctrl + N", b: "Ctrl + F",
                c: "Ctrl + Shift + F", d: "Ctrl + Shift + N" }, "d");
        addQ(24, "Which of the following is a popular navigation and maps application?", { a: "Google Maps", b: "Reddit",
                c: "Snapchat", d: "Pinterest" }, "a");
        addQ(25, "What is the primary purpose of a USB flash drive?", { a: "Input data", b: "Display output",
                c: "Portable data storage", d: "Process data" }, "c");
        addQ(26, "What is the decimal equivalent of the octal number 377?", { a: "256", b: "255", c: "254", d: "257" },

        addQ(27, "Which of the following is a popular app for meditation and mindfulness?", { a: "Headspace", b: "Pinterest",
                c: "Reddit", d: "LinkedIn" }, "a");

        addQ(31, "What is the primary purpose of a mouse?", { a: "Process data", b: "Point and select on screen",

        addQ(32, "Which shortcut key is used to copy selected content?", { a: "Ctrl + V", b: "Ctrl + Z", c: "Ctrl + X",

        addQ(33, "Which of the following is an example of a programming language?", { a: "Windows Media Player",

        addQ(34, "What does LAN stand for?", { a: "Long Access Network", b: "Large Area Network", c: "Local Area Network",

        addQ(35, "What is the primary purpose of a plotter?", { a: "Process data",

        addQ(50, "What is the hexadecimal equivalent of the binary number 11111111?", { a: "FE", b: "100", c: "F0",

        addQ(51, "Which of the following is a programming/script file extension?", { a: ".mp4", b: ".py", c: ".jpg",

        addQ(52, "In binary, which two digits are used to represent data?", { a: "1 and 9", b: "0 and 1", c: "1 and 2",

        addQ(53, "Which of the following is an example of a web browser?", { a: "iTunes", b: "Puffin Browser", c: "Excel",

        addQ(54, "Which protocol provides a faster but less reliable, connectionless communication method?", { a: "UDP",

        addQ(55, "What is the hexadecimal equivalent of the decimal number 128?", { a: "7F", b: "81", c: "80", d: "90" },

        addQ(56, "Which of the following is an example of Software as a Service (SaaS)?", { a: "Windows Media Player",

        addQ(57, "What is the decimal equivalent of the hexadecimal number A?", { a: "10", b: "12", c: "9", d: "11" },

        addQ(58, "What is the hexadecimal equivalent of the binary number 10000?", { a: "0F", b: "10", c: "F", d: "11" },

        addQ(59, "What is the binary equivalent of the decimal number 60?", { a: "111100", b: "110100", c: "111000",

        addQ(60, "Which of the following best describes 'non-volatile memory'?", { a: "Memory used only for processing",
                b: "Memory found only in the CPU", c: "Memory that loses data when power is off",
                d: "Memory that retains data without power" }, "d");
        addQ(61, "Which protocol is used for automatic configuration of network settings when a device connects to a network?",

        addQ(62, "What is the decimal equivalent of the binary number 110?", { a: "6", b: "7", c: "4", d: "5" }, "a");
        addQ(63, "What is the purpose of a digital signature?", { a: "Speed up file transfer", b: "Increase file size",
                c: "Store passwords securely",
                d: "Verify the authenticity and integrity of a digital message or document" }, "d");
        addQ(64, "Which protocol establishes a reliable, connection-oriented communication between devices?", { a: "TCP",
                b: "FTP", c: "UDP", d: "HTTP" }, "a");
        addQ(65, "What is the decimal equivalent of the octal number 12?", { a: "9", b: "12", c: "10", d: "11" }, "c");
        addQ(66, "Which of the following is a valid Class B IPv4 address?", { a: "172.999.5.5", b: "172.16.5.5",
                c: "172.16.5.5.5", d: "172.16.5" }, "b");
        addQ(67, "Which of the following is a cloud computing platform developed by Google?", { a: "Google Cloud Platform",

        //  APPLICATION STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let state = {
            current: 0,
            answers: {},
            review: {},
            submitted: false,
            showDetails: false,
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const $ = id => document.getElementById(id);
        const paletteEl = $('palette');
        const qNumber = $('qNumber');
        const qText = $('qText');
        const optionsContainer = $('optionsContainer');
        const feedback = $('feedback');
        const prevBtn = $('prevBtn');
        const nextBtn = $('nextBtn');
        const reviewBtn = $('reviewBtn');
        const submitBtn = $('submitBtn');
        const resetBtn = $('resetBtn');
        const progressText = $('progressText');
        const resultsDiv = $('results');
        const resultSummary = $('resultSummary');
        const resultDetail = $('resultDetail');
        const toggleDetailsBtn = $('toggleDetailsBtn');
        const modeBadge = $('modeBadge');
        const jumpInput = $('jumpInput');
        const jumpBtn = $('jumpBtn');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER FUNCTIONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderPalette() {
            let html = '';
            for (let i = 0; i < questions.length; i++) {
                let cls = 'palette-btn';
                if (state.answers[i] !== undefined) cls += ' answered';
                if (state.review[i]) cls += ' review';
                if (i === state.current) cls += ' active';
                html += `<button class="${cls}" data-index="${i}">${i+1}</button>`;
            }
            html += `<div class="palette-legend">
                <span><span class="legend-dot unanswered"></span> Unanswered</span>
                <span><span class="legend-dot answered"></span> Answered</span>
                <span><span class="legend-dot review"></span> Review</span>
            </div>`;
            paletteEl.innerHTML = html;

            paletteEl.querySelectorAll('.palette-btn[data-index]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    if (!state.submitted) {
                        state.current = idx;
                        jumpInput.value = idx + 1;
                        renderQuestion();
                    }
                });
            });
        }

        function renderQuestion() {
            const q = questions[state.current];
            const idx = state.current;
            qNumber.textContent = `Q${idx+1}.`;
            qText.textContent = q.q;

            const letters = ['a', 'b', 'c', 'd'];
            let optHtml = '';
            const selected = state.answers[idx];
            const isSubmitted = state.submitted;
            const correctAns = q.ans;

            letters.forEach(letter => {
                const label = q.opts[letter];
                if (!label) return;
                let cls = 'option';
                if (selected === letter) cls += ' selected';
                if (isSubmitted) {
                    if (letter === correctAns) cls += ' correct';
                    if (selected === letter && letter !== correctAns) cls += ' wrong';
                }
                const checked = selected === letter ? 'checked' : '';
                const disabled = isSubmitted ? 'disabled' : '';
                optHtml += `
                    <label class="${cls}">
                        <input type="radio" name="q${idx}" value="${letter}" ${checked} ${disabled} />
                        <span class="label">${letter.toUpperCase()}.</span> ${label}
                    </label>
                `;
            });
            optionsContainer.innerHTML = optHtml;

            if (!isSubmitted) {
                optionsContainer.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        const val = e.target.value;
                        state.answers[idx] = val;
                        if (state.review[idx]) delete state.review[idx];
                        renderPalette();
                        renderQuestion();
                        showFeedback(idx);
                    });
                });
            }

            if (isSubmitted) {
                const correct = state.answers[idx] === q.ans;
                feedback.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
                feedback.textContent = correct ?
                    '✅ Correct!' :
                    `❌ Incorrect. Correct answer: ${q.ans.toUpperCase()}. ${q.opts[q.ans]}`;
            } else {
                feedback.className = 'feedback';
                feedback.textContent = '';
            }

            progressText.textContent = `${idx+1} / ${questions.length}`;
            reviewBtn.textContent = state.review[idx] ? '⭐ Unmark' : '⭐ Review';
            reviewBtn.classList.toggle('active', !!state.review[idx]);
            prevBtn.disabled = idx === 0;
            nextBtn.disabled = idx === questions.length - 1;
            jumpInput.value = idx + 1;
        }

        function showFeedback(idx) {
            const q = questions[idx];
            const selected = state.answers[idx];
            if (!selected) {
                feedback.className = 'feedback';
                feedback.textContent = '';
                return;
            }
            const correct = selected === q.ans;
            feedback.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
            feedback.textContent = correct ?
                '✅ Correct!' :
                `❌ Incorrect. Correct answer: ${q.ans.toUpperCase()}. ${q.opts[q.ans]}`;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  NAVIGATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function goTo(index) {
            if (index < 0 || index >= questions.length) return;
            state.current = index;
            renderQuestion();
            renderPalette();
        }

        prevBtn.addEventListener('click', () => goTo(state.current - 1));
        nextBtn.addEventListener('click', () => goTo(state.current + 1));

        jumpBtn.addEventListener('click', () => {
            let val = parseInt(jumpInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > questions.length) val = questions.length;
            goTo(val - 1);
        });

        jumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') jumpBtn.click();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  REVIEW
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        reviewBtn.addEventListener('click', () => {
            if (state.submitted) return;
            const idx = state.current;
            if (state.review[idx]) {
                delete state.review[idx];
            } else {
                state.review[idx] = true;
            }
            renderPalette();
            renderQuestion();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SUBMIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        submitBtn.addEventListener('click', function() {
            if (state.submitted) return;

            const total = questions.length;
            const answered = Object.keys(state.answers).length;

            let confirmMessage = '';
            if (answered < total) {
                confirmMessage =
                    `You have answered ${answered} out of ${total} questions. ${total - answered} questions are unanswered.\n\nAre you sure you want to submit?`;
            } else {
                confirmMessage = 'You have answered all questions!\n\nSubmit your exam for grading?';
            }

            if (!confirm(confirmMessage)) return;

            state.submitted = true;
            submitBtn.style.display = 'none';
            resetBtn.style.display = 'inline-flex';
            modeBadge.textContent = '📊 Results';

            renderQuestion();
            renderPalette();
            showResults();
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RESULTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function showResults() {
            let correct = 0;
            let wrong = 0;
            let unanswered = 0;
            const details = [];

            questions.forEach((q, i) => {
                const userAns = state.answers[i];
                const isCorrect = userAns === q.ans;
                const status = userAns === undefined ? 'unanswered' : (isCorrect ? 'correct' : 'wrong');
                if (status === 'correct') correct++;
                else if (status === 'wrong') wrong++;
                else unanswered++;
                details.push({
                    index: i,
                    q: q.q,
                    userAns: userAns || '(not answered)',
                    correctAns: q.ans,
                    correct: isCorrect,
                    status,
                    isReview: !!state.review[i]
                });
            });

            const total = questions.length;
            const score = correct;
            const percent = Math.round((score / total) * 100);

            resultSummary.innerHTML = `
                <h2>📊 Exam Results</h2>
                <div class="score">${score} / ${total}</div>
                <div class="sub">${percent}% &nbsp;|&nbsp; ✅ ${correct} Correct &nbsp;|&nbsp; ❌ ${wrong} Wrong &nbsp;|&nbsp; ⬜ ${unanswered} Unanswered</div>
                ${percent >= 80 ? '<div style="margin-top:10px;font-size:20px;color:#2b6cb0;">🎉 Excellent! Great job!</div>' : 
                  percent >= 60 ? '<div style="margin-top:10px;font-size:20px;color:#ed8936;">👍 Good effort! Keep practicing!</div>' : 
                  '<div style="margin-top:10px;font-size:20px;color:#e53e3e;">📚 Review the material and try again!</div>'}
            `;

            let detailHtml = '';
            details.forEach(d => {
                const statusLabel = d.status === 'correct' ? '✅ Correct' :
                    d.status === 'wrong' ? '❌ Wrong' : '⬜ Unanswered';
                const reviewMark = d.isReview ? ' ⭐' : '';
                detailHtml += `
                    <div class="result-item">
                        <span class="qid">Q${d.index+1}${reviewMark}</span>
                        <span style="flex:1;padding:0 8px;font-size:12px;">${d.q.substring(0,50)}${d.q.length>50?'…':''}</span>
                        <span style="font-size:11px;color:#4a5568;min-width:50px;">Your: ${d.userAns.toUpperCase()}</span>
                        <span style="font-size:11px;color:#2b6cb0;font-weight:600;min-width:50px;">Correct: ${d.correctAns.toUpperCase()}</span>
                        <span class="status ${d.status}">${statusLabel}</span>
                    </div>
                `;
            });
            resultDetail.innerHTML = detailHtml;

            resultsDiv.classList.add('show');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  TOGGLE DETAILS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        toggleDetailsBtn.addEventListener('click', () => {
            state.showDetails = !state.showDetails;
            resultDetail.style.display = state.showDetails ? 'block' : 'none';
            toggleDetailsBtn.textContent = state.showDetails ? '📋 Hide Details' : '📋 Show Details';
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RESET
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        resetBtn.addEventListener('click', () => {
            if (confirm('🔄 Reset the entire exam? All progress will be lost.')) {
                state = {
                    current: 0,
                    answers: {},
                    review: {},
                    submitted: false,
                    showDetails: false,
                };
                resultsDiv.classList.remove('show');
                resultDetail.style.display = 'none';
                resultDetail.innerHTML = '';
                submitBtn.style.display = 'inline-flex';
                resetBtn.style.display = 'none';
                modeBadge.textContent = 'Learning Mode';
                renderPalette();
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  KEYBOARD SHORTCUTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || state.submitted) return;
            if (e.key === 'ArrowLeft') { e.preventDefault();
                prevBtn.click(); } else if (e.key === 'ArrowRight') { e.preventDefault();
                nextBtn.click(); } else if (e.key === 'r' || e.key === 'R') { e.preventDefault();
                reviewBtn.click(); } else if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (state.current === questions.length - 1) submitBtn.click();
                else nextBtn.click();
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        renderPalette();
        renderQuestion();

        console.log('📘 BICTE Computer GK - 630 Practice Questions loaded!');
        console.log(`📝 ${questions.length} questions available.`);
        console.log('⌨️  Shortcuts: ← → navigate, R = review, Enter = next/submit');
    </script>

</body>
</html>
